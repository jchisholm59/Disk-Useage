<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Usage Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #2f4f4f; color: #f1f5f9; }
        .container { max-width: 1200px; margin: auto; background: #263e3e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .charts { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .chart-container { flex: 1; min-width: 300px; background: #2f4f4f; padding: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; color: #e2e8f0; }
        th, td { border: 1px solid #3d6464; padding: 12px; text-align: left; }
        th { background-color: #3d6464; color: #ffffff; }
        tr:hover { background-color: #3d6464; cursor: pointer; }
        .folder { color: #5eead4; font-weight: bold; }
        .btn-delete { background: #f43f5e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #e11d48; }
        .controls { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input[type="text"] { background: #2f4f4f; color: white; border: 1px solid #3d6464; padding: 10px; border-radius: 4px; outline: none; }
        input[type="text"]:focus { border-color: #5eead4; }
        button { padding: 10px 20px; border: none; border-radius: 4px; background: #0d9488; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0f766e; }
        #breadcrumbs span { color: #5eead4; }
        #breadcrumbs { color: #94a3b8 !important; }
        #folderSummary { color: #5eead4 !important; }
        #largeFileModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#1e293b; padding:30px; border-radius:12px; border:2px solid #3d6464; z-index:1000; width:90%; max-height:80%; overflow-y:auto; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #largeFileTable { table-layout: fixed; }
        #largeFileTable td { word-break: break-all; vertical-align: top; }
        #largeFileTable th:nth-child(1) { width: 20%; }
        #largeFileTable th:nth-child(2) { width: 65%; }
        #largeFileTable th:nth-child(3) { width: 15%; text-align: right; }
        #largeFileTable td:nth-child(3) { text-align: right; font-weight: bold; color: #5eead4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Disk Usage Analyzer</h1>
        <div class="controls">
            <button id="backBtn" onclick="goBack()" style="background: #64748b;" disabled>Back</button>
            <input type="text" id="pathInput" value="~" placeholder="Enter path to scan">
            <button onclick="scanPath()">Scan</button>
            <input type="text" id="searchInput" placeholder="Search in results..." style="margin-left: 20px; width: 200px;">
            <button onclick="findDuplicates()" style="background: #17a2b8; margin-left: 20px;">Find Duplicates</button>
            <button onclick="showLargeFiles()" style="background: #8b5cf6; margin-left: 10px;">Large Files</button>
        </div>

        <div id="largeFileModal">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 style="margin:0;">Top 50 Largest Files</h2>
                <button onclick="closeModal()" style="background:#ef4444; padding:5px 15px;">Close</button>
            </div>
            <table id="largeFileTable">
                <thead>
                    <tr><th>Name</th><th>Path</th><th>Size</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div id="modalOverlay" onclick="closeModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999;"></div>


        <nav id="breadcrumbs" style="margin-bottom: 15px; font-size: 0.9em; color: #666;"></nav>

        <div id="folderSummary" style="margin-bottom: 20px; font-size: 1.2em; font-weight: bold; color: #10b981;">
            Total Folder Size: <span id="totalSizeValue">Calculating...</span>
        </div>

        <div class="charts">
            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="typeChart"></canvas>
            </div>
            <div class="chart-container" style="flex: 2;">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
